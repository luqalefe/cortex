<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Delay — Simulador</title>
<style>
  :root {
    --bg0:#0c0e12; --bg1:#141821; --ink:#eef1f5; --muted:#7c8697;
    --accent:#35e0cf; --accent-dim:#1c7f76; --amber:#ffb13b;
    --chassis-a:#2b313c; --chassis-b:#171b22; --screw:#3a4150;
  }
  * { box-sizing: border-box; }
  html,body { height:100%; }
  body {
    margin:0; color:var(--ink);
    font:15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2533 0%, transparent 60%),
      radial-gradient(900px 500px at 50% 120%, #10201e 0%, transparent 55%),
      var(--bg0);
    display:flex; flex-direction:column; align-items:center; padding:28px 16px 48px;
  }
  .brand { display:flex; align-items:baseline; gap:10px; margin-bottom:2px; }
  .brand b { font-size:22px; letter-spacing:.34em; font-weight:800; }
  .brand span { font-size:12px; letter-spacing:.42em; color:var(--accent); text-transform:uppercase; }
  .tag { color:var(--muted); font-size:12px; letter-spacing:.08em; margin-bottom:22px; }

  .pedal {
    position:relative; width:100%; max-width:460px;
    background:
      linear-gradient(180deg, var(--chassis-a), var(--chassis-b)),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 4px);
    border:1px solid #05070a; border-radius:26px;
    padding:26px 26px 30px;
    box-shadow:
      0 30px 60px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.05) inset,
      0 -24px 40px rgba(0,0,0,.4) inset;
  }
  .screw { position:absolute; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #5b6474, var(--screw) 70%, #10131a);
    box-shadow:0 1px 1px rgba(0,0,0,.6), 0 0 0 1px #0a0d12; }
  .screw::after { content:""; position:absolute; inset:4px; border-top:2px solid rgba(0,0,0,.45);
    transform:rotate(35deg); }
  .screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px}
  .screw.bl{bottom:12px;left:12px}.screw.br{bottom:12px;right:12px}

  .head { display:flex; justify-content:space-between; align-items:center; margin:2px 4px 16px; }
  .head .title { font-size:13px; letter-spacing:.28em; color:var(--muted); text-transform:uppercase; }
  .conn { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); letter-spacing:.06em; }
  .dot { width:8px; height:8px; border-radius:50%; background:#5a2030; box-shadow:0 0 0 1px #000 inset; transition:.25s; }
  .dot.on { background:var(--accent); box-shadow:0 0 8px var(--accent); }

  .screen {
    position:relative; border-radius:12px; overflow:hidden; margin-bottom:22px;
    border:1px solid #0a1412; background:#04100e;
    box-shadow:0 2px 10px rgba(0,0,0,.5) inset, 0 0 0 3px #0c0f14;
  }
  canvas { display:block; width:100%; height:160px; }
  .readout {
    position:absolute; top:10px; left:12px; right:12px; display:flex; justify-content:space-between;
    font:11px ui-monospace, Menlo, monospace; color:var(--accent); letter-spacing:.04em;
    text-shadow:0 0 6px rgba(53,224,207,.5); pointer-events:none;
  }
  .readout .bank { color:var(--amber); text-shadow:0 0 6px rgba(255,177,59,.5); }

  .knobs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  @media (max-width:420px){ .knobs{ grid-template-columns:repeat(2,1fr); gap:18px 6px; } }
  .knob { display:flex; flex-direction:column; align-items:center; gap:7px; user-select:none; }
  .knob svg { cursor:ns-resize; touch-action:none; display:block; }
  .knob .name { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .knob .val { font:12px ui-monospace, monospace; color:var(--ink); min-height:14px; }

  .foot { margin-top:26px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .stomp-led { width:12px; height:12px; border-radius:50%; background:#2a1414; box-shadow:0 0 0 2px #0a0d12, 0 0 0 4px #1a1e26; transition:.08s; }
  .stomp-led.on { background:var(--amber); box-shadow:0 0 14px var(--amber), 0 0 0 2px #0a0d12, 0 0 0 4px #1a1e26; }
  .fsw {
    width:104px; height:104px; border-radius:50%; border:none; cursor:pointer; color:var(--ink);
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
    background:
      radial-gradient(circle at 50% 32%, #5a606c 0%, #343a45 45%, #1d212a 75%),
      #1d212a;
    box-shadow:0 10px 22px rgba(0,0,0,.6), 0 2px 2px rgba(255,255,255,.12) inset, 0 -10px 16px rgba(0,0,0,.5) inset;
    transition:transform .05s;
  }
  .fsw:active { transform:translateY(3px); box-shadow:0 4px 10px rgba(0,0,0,.6), 0 2px 2px rgba(255,255,255,.1) inset; }

  .hint { color:var(--muted); font-size:12px; margin-top:22px; text-align:center; max-width:460px; line-height:1.6; }
  .hint code { color:#aeb7c6; background:#0f131a; padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
  <div class="brand"><b>CODEX</b><span>delay</span></div>
  <div class="tag">simulador do pedal · motor em tempo real</div>

  <div class="pedal">
    <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
    <div class="head">
      <div class="title">Codex Delay</div>
      <div class="conn"><span class="dot" id="dot"></span><span id="status">conectando…</span></div>
    </div>

    <div class="screen">
      <canvas id="viz"></canvas>
      <div class="readout">
        <span id="ro-left">CODEX DELAY</span>
        <span class="bank" id="ro-right">—</span>
      </div>
    </div>

    <div class="knobs" id="knobs"></div>

    <div class="foot">
      <div class="stomp-led" id="led"></div>
      <button class="fsw" id="fsw">Active</button>
    </div>
  </div>

  <div class="hint">
    Motor: <code>codex-engine --in "GP-5" --out "GP-5"</code>.
    Arraste os knobs (duplo-clique = padrão). O footswitch faz o bypass.
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
